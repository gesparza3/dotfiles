# vim: ft=cfg
# Minimal, portable rifle.conf tuned for Neovim + CLI tools.
# Avoids passing bare `--` so it works with BusyBox/MSYS variants.

# =============================
# Defaults (editor / pager)
# =============================
# vim: ft=cfg
# Open almost everything in Neovim by default. Use labels for exceptions.

# Make Neovim the default editor for all text-like files.
# ${VISUAL:-${EDITOR:-nvim}} ensures it respects VISUAL or EDITOR if set,
# but always falls back to nvim if neither is defined.
mime ^text, label editor = ${VISUAL:-${EDITOR:-nvim}} "$@"
mime ^text, label pager  = ${PAGER:-less} "$@"

# Apply the same behavior to other structured-text/code formats.
# You can extend this ext pattern if needed.
!mime ^text, label editor, ext xml|json|csv|yml|yaml|toml|ini|tex|py|pl|rb|js|ts|sh|php|lua|go|rs|cpp|c|h|md|conf = ${VISUAL:-${EDITOR:-nvim}} "$@"
!mime ^text, label pager,  ext xml|json|csv|yml|yaml|toml|ini|tex|py|pl|rb|js|ts|sh|php|lua|go|rs|cpp|c|h|md|conf = ${PAGER:-less} "$@"

# Catch-all fallback: open anything not matched above in Neovim too.
# This ensures even oddball files launch cleanly.
!directory, !mime ^text, label editor = ${VISUAL:-${EDITOR:-nvim}} "$@"

# Makefiles (run with 'make' if explicitly invoked)
name ^[mM]akefile$ = make


# =============================
# Browsers
# =============================
# Prefer rare → common. No `--` separator used.
ext x?html?, has qutebrowser,  X, flag f = qutebrowser "$@"
ext x?html?, has firefox,      X, flag f = firefox "$@"
ext x?html?, has chromium,     X, flag f = chromium "$@"
ext x?html?, has google-chrome,X, flag f = google-chrome "$@"
ext x?html?, has w3m,        terminal   = w3m "$@"
ext x?html?, has lynx,       terminal   = lynx "$@"
ext x?html?, has elinks,     terminal   = elinks "$@"
ext x?html?, has links,      terminal   = links "$@"

# =============================
# Scripts
# =============================
ext py  = python "$1"
ext pl  = perl "$1"
ext rb  = ruby "$1"
ext js  = node "$1"
ext sh  = sh "$1"
ext php = php "$1"

# =============================
# Audio / Video
# =============================
# GUI players
mime ^video|audio, has mpv, X, flag f = mpv "$@"
mime ^video|audio, has vlc, X, flag f = vlc "$@"
mime ^video,       has mpv, X, flag f = mpv --fs "$@"

# TTY players
mime ^video|audio, terminal, !X, has mpv      = mpv "$@"
mime ^video,       terminal, !X, has mplayer  = mplayer "$@"

# MIDI
ext midi?, terminal, has wildmidi = wildmidi "$@"

# =============================
# Documents
# =============================
ext pdf, has zathura,  X, flag f = zathura "$@"
ext pdf, has mupdf,    X, flag f = mupdf "$@"
ext pdf, has evince,   X, flag f = evince "$@"
ext pdf, has okular,   X, flag f = okular "$@"
ext pdf, has qpdfview, X, flag f = qpdfview "$@"
ext pdf, has open,     X, flag f = open "$@"         # macOS

ext docx?, has catdoc, terminal = sh -c 'catdoc "$@" | ${PAGER:-less}' _ "$@"

ext pptx?|od[dfgpst]|docx?|sxc|xlsx?|xlt|xlw|gnm|gnumeric, has libreoffice, X, flag f = libreoffice "$@"
ext pptx?|od[dfgpst]|docx?|sxc|xlsx?|xlt|xlw|gnm|gnumeric, has soffice,     X, flag f = soffice "$@"

ext djvu, has zathura, X, flag f = zathura "$@"
ext djvu, has evince,  X, flag f = evince "$@"
ext djvu, has atril,   X, flag f = atril "$@"
ext djvu, has djview,  X, flag f = djview "$@"

ext epub, has ebook-viewer, X, flag f = ebook-viewer "$@"
ext epub, has zathura,      X, flag f = zathura "$@"
ext epub, has mupdf,        X, flag f = mupdf "$@"
ext mobi, has ebook-viewer, X, flag f = ebook-viewer "$@"

# =============================
# Images
# =============================
mime ^image/svg, has inkscape, X, flag f = inkscape "$@"
mime ^image,     has imv,      X, flag f = imv "$@"
mime ^image,     has sxiv,     X, flag f = sxiv "$@"
mime ^image,     has feh,      X, flag f = feh "$@"
mime ^image,     has eog,      X, flag f = eog "$@"
mime ^image,     has gimp,     X, flag f = gimp "$@"
ext xcf,                     X, flag f = gimp "$@"

# =============================
# Archives
# =============================
# atool path (list & extract)
ext 7z, has 7z    = sh -c '7z -p l "$@" | ${PAGER:-less}' _ "$@"
ext ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz,     has atool = sh -c 'atool --list --each "$@" | ${PAGER:-less}' _ "$@"
ext iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has atool = sh -c 'atool --list --each "$@" | ${PAGER:-less}' _ "$@"
ext 7z|ace|ar|arc|bz2?|cab|cpio|cpt|deb|dgc|dmg|gz,  has atool = atool --extract --each "$@"
ext iso|jar|msi|pkg|rar|shar|tar|tgz|xar|xpi|xz|zip, has atool = atool --extract --each "$@"

# Without atool
ext tar|gz|bz2|xz, has tar = sh -c 'for f in "$@"; do tar vvtf "$f"; done | ${PAGER:-less}' _ "$@"
ext tar|gz|bz2|xz, has tar = sh -c 'for f in "$@"; do tar vvxf "$f"; done' _
ext bz2,           has bzip2 = sh -c 'for f in "$@"; do bzip2 -dk "$f"; done' _
ext zip,           has unzip = sh -c 'unzip -l "$1" | ${PAGER:-less}'
ext zip,           has unzip = sh -c 'for f in "$@"; do d="${f%.*}"; mkdir -p "$d"; unzip -d "$d" "$f"; done' _
ext rar,           has unrar = sh -c 'unrar l "$1" | ${PAGER:-less}'
ext rar,           has unrar = sh -c 'for f in "$@"; do unrar x "$f"; done' _

# =============================
# Fonts
# =============================
mime ^font, has fontforge, X, flag f = fontforge "$@"

# =============================
# Terminals for flag t
# =============================
mime ^ranger/x-terminal-emulator, has kitty            = kitty "$@"
mime ^ranger/x-terminal-emulator, has alacritty        = alacritty -e "$@"
mime ^ranger/x-terminal-emulator, has xfce4-terminal   = xfce4-terminal -x "$@"
mime ^ranger/x-terminal-emulator, has gnome-terminal   = gnome-terminal -- "$@"
mime ^ranger/x-terminal-emulator, has xterm            = xterm -e "$@"

# =============================
# Misc
# =============================
label wallpaper, number 11, mime ^image, has feh, X = feh --bg-scale "$1"
label wallpaper, number 12, mime ^image, has feh, X = feh --bg-tile "$1"
label wallpaper, number 13, mime ^image, has feh, X = feh --bg-center "$1"
label wallpaper, number 14, mime ^image, has feh, X = feh --bg-fill "$1"

# Generic openers
label open, has xdg-open = xdg-open "$@"
label open, has open     = open "$@"   # macOS

# For non-text as last resort: ask, or force editor/pager
!mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php = ask
label editor, !mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php = ${VISUAL:-${EDITOR:-nvim}} "$@"
label pager,  !mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php = ${PAGER:-less} "$@"

######################################################################
# Low-priority actions (rarely triggered)
######################################################################
mime application/x-executable = "$1"

# Trash
label trash, has trash-put = trash-put "$@"
label trash = sh -c 'd=${XDG_DATA_DIR:-$HOME/.ranger}/ranger-trash; mkdir -p "$d"; mv "$@" "$d"' _ "$@"

